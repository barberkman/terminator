name: Windows build

# Every push to main (a merged PR, usually) builds the Windows installer and
# portable exe, tags the commit vYYYY.MM.DD.N (UTC; N counts that day's
# builds) and publishes both exes on a GitHub Release for the tag.
# Pull requests into main only build, so a broken Windows build shows up
# before it merges; their exes are kept as a workflow artifact for a week.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The tag is taken before the build, not after: a push of a tag that
      # already exists is rejected, so two merges landing close together
      # can't both get the same N — the loser re-reads the tags and takes the
      # next one. No concurrency group needed, so no merge is ever skipped.
      - name: Reserve version tag
        id: version
        if: github.event_name == 'push'
        run: |
          read -r y m d < <(date -u '+%Y %m %d')
          day="$y.$m.$d"
          for _ in 1 2 3 4 5; do
            last=$(git ls-remote --tags --refs origin \
              | sed -n "s|.*refs/tags/v${day//./\\.}\.\([0-9][0-9]*\)$|\1|p" \
              | sort -n | tail -1)
            n=$(( ${last:-0} + 1 ))
            tag="v$day.$n"
            git tag "$tag" "$GITHUB_SHA"
            if git push origin "refs/tags/$tag"; then
              # electron-builder wants a semver app version (no leading zeros);
              # the Windows file version carries the day's build number too.
              semver="$y.$((10#$m)).$((10#$d))"
              {
                echo "tag=$tag"
                echo "version=${tag#v}"
                echo "semver=$semver"
                echo "filever=$semver.$n"
              } >> "$GITHUB_OUTPUT"
              echo "Reserved $tag"
              exit 0
            fi
            git tag -d "$tag"
          done
          echo "::error::Could not reserve a version tag for $day"
          exit 1

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SEMVER: ${{ steps.version.outputs.semver }}
          FILEVER: ${{ steps.version.outputs.filever }}
        run: |
          args=(--publish never)
          if [ -n "$VERSION" ]; then
            npm version "$SEMVER" --no-git-tag-version --allow-same-version
            args+=(
              "-c.buildVersion=$FILEVER"
              "-c.nsis.artifactName=Terminator-Setup-$VERSION.exe"
              "-c.portable.artifactName=Terminator-Portable-$VERSION.exe"
            )
          fi
          npm run dist:win -- "${args[@]}"

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            "release/Terminator-Setup-$VERSION.exe" \
            "release/Terminator-Portable-$VERSION.exe" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Terminator $VERSION" \
            --generate-notes \
            --verify-tag

      - name: Upload exes
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: terminator-windows
          path: release/Terminator-*.exe
          if-no-files-found: error
          retention-days: 7

      # A failed or cancelled build gives its tag back, so no tag is left
      # without its exes and re-running the job reserves a fresh one.
      - name: Release the tag on failure
        if: ${{ !success() && steps.version.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag \
            || git push origin ":refs/tags/$TAG"
